<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Historial de Pagos</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      margin:40px;
    }

    .cards{
      display:flex;
      gap:20px;
      margin-bottom:30px;
      flex-wrap:wrap;
    }

    .card{
      background:#f8f9fa;
      border-radius:10px;
      padding:20px;
      min-width:220px;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
    }

    .card h3{
      margin:0;
      font-size:16px;
    }

    .card p{
      font-size:28px;
      margin-top:10px;
      font-weight:bold;
    }

    table{
      width:100%;
      border-collapse:collapse;
      margin-top:20px;
    }

    th, td{
      border:1px solid #ddd;
      padding:10px;
      text-align:left;
    }

    th{
      background:#f4f4f4;
    }

    tr:nth-child(even){
      background:#fafafa;
    }

    #graficaPagos{
      max-height:400px;
      margin-bottom:30px;
    }

  </style>

</head>

<body>

  <h2>📋 Historial de Pagos</h2>

  <div class="cards">

    <div class="card">
      <h3>💰 Total Recaudado</h3>
      <p id="total-recaudado">$0</p>
    </div>

    <div class="card">
      <h3>📋 Total Pagos</h3>
      <p id="total-pagos">0</p>
    </div>

    <div class="card">
      <h3>✅ Aprobados</h3>
      <p id="aprobados">0</p>
    </div>

  </div>

  <input
    type="text"
    id="buscador"
    placeholder="Buscar por nombre o email..."
    style="
      width:100%;
      padding:10px;
      margin-bottom:20px;
      font-size:16px;
    "
  >

  <h3>📈 Ingresos</h3>

  <canvas id="graficaPagos"></canvas>

  <table>

    <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Monto</th>
        <th>Estado</th>
        <th>Fecha</th>
      </tr>
    </thead>

    <tbody id="tabla-pagos">
    </tbody>

  </table>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>

    let todosLosPagos = [];
    let grafica = null;

    async function cargarEstadisticas(){

      const response = await fetch("/api/estadisticas");

      const stats = await response.json();

      document.getElementById("total-recaudado").textContent =
        "$" + stats.totalRecaudado.toLocaleString();

      document.getElementById("total-pagos").textContent =
        stats.totalPagos;

      document.getElementById("aprobados").textContent =
        stats.aprobados;

    }

    function mostrarPagos(pagos){

      const tbody = document.getElementById("tabla-pagos");

      tbody.innerHTML = "";

      pagos.forEach(pago => {

        const fila = document.createElement("tr");

        fila.innerHTML = `
          <td>${pago.name || ""}</td>
          <td>${pago.email || ""}</td>
          <td>$${pago.amount.toLocaleString()}</td>
          <td>${pago.status}</td>
          <td>${new Date(pago.createdAt).toLocaleString()}</td>
        `;

        tbody.appendChild(fila);

      });

    }

    function crearGrafica(pagos){

      const etiquetas = pagos.map(
        pago => new Date(pago.createdAt).toLocaleDateString()
      );

      const montos = pagos.map(
        pago => pago.amount / 100
      );

      const ctx = document.getElementById("graficaPagos");

      if(grafica){
        grafica.destroy();
      }

      grafica = new Chart(ctx, {
        type: "bar",
        data: {
          labels: etiquetas,
          datasets: [{
            label: "Monto (COP)",
            data: montos
          }]
        }
      });

    }

    async function cargarPagos(){

      const response = await fetch("/api/pagos");

      todosLosPagos = await response.json();

      mostrarPagos(todosLosPagos);

      crearGrafica(todosLosPagos);

    }

    document.getElementById("buscador")
      .addEventListener("input", function(){

        const texto = this.value.toLowerCase();

        const filtrados = todosLosPagos.filter(pago =>

          (pago.name || "")
            .toLowerCase()
            .includes(texto)

          ||

          (pago.email || "")
            .toLowerCase()
            .includes(texto)

        );

        mostrarPagos(filtrados);

      });

    cargarEstadisticas();
    cargarPagos();

  </script>

</body>
</html>
